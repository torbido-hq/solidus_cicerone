name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
        env:
          BUNDLE_GEMFILE: Gemfile.unit
      - run: bundle exec rspec
        env:
          BUNDLE_GEMFILE: Gemfile.unit
